name: Fix Consortium wording

on:
  push:
    paths:
      - '.github/workflows/fix-consortium.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Consortium on the Bursell talk line
        run: |
          set -euo pipefail
          sed -i 's/Confidential Computing Coalition/Confidential Computing Consortium/g' README.md
          if git diff --quiet README.md; then
            echo "No Coalition typo; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "fix: restore Confidential Computing Consortium on talk line"
          git push
