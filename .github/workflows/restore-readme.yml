name: restore-readme
on:
  push:
    paths:
      - '_restore/**'
      - '.github/workflows/restore-readme.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-csoai-gspc
      - name: Decode and write README.md
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          parts = sorted(pathlib.Path('_restore').glob('part*.b64'))
          b64 = ''.join(p.read_text().strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('README.md').write_bytes(raw)
          print('wrote README.md', len(raw), 'from', [p.name for p in parts])
          assert b'Council of AI' in raw
          PY
      - name: Commit README.md and cleanup helpers
        run: |
          git config user.name "Nicholas Templeman"
          git config user.email "nicholas@csoai.org"
          git add README.md
          git rm -rf _restore .github/workflows/restore-readme.yml _mcp_size_probe.txt || true
          git commit -m "Restore README.md with Council of AI GSPC under Security Testing" || true
          git push
