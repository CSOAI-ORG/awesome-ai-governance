<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Awesome AI Governance">
  <title>Awesome AI Governance</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F4F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15294B"/>
      <stop offset="100%" stop-color="#1B5EA0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <path d="M200,58 L326,112 L326,224 C326,298 268,340 200,360 C132,340 74,298 74,224 L74,112 Z"
        fill="url(#brand)" opacity="0.10" stroke="url(#brand)" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Glyph: a curated list. Entries reviewed and kept, not everything that exists. -->
  <rect x="132" y="228" width="136" height="17" rx="8" fill="url(#brand)"/>
  <rect x="132" y="264" width="136" height="17" rx="8" fill="url(#brand)"/>
  <!-- Exactly one red element: the mark against the entry that earned its place. -->
  <rect x="132" y="192" width="136" height="17" rx="8" fill="url(#brand)"/>
  <circle cx="112" cy="200" r="10" fill="#B91C1C"/>
  <circle cx="112" cy="236" r="9" fill="url(#brand)"/>
  <circle cx="112" cy="272" r="9" fill="url(#brand)"/>
</svg>
